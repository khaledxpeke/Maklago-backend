openapi: 3.0.3
info:
  title: maklaGo API
  version: 1.0.0
  description: |
    Cashier-focused REST API for `/api/v1/*`:
    - Optional header `x-tenant-id` (tenant slug or registry UUID). With `Authorization: Bearer` staff JWT,
      the tenant is resolved from the token when this header is omitted.
    - `POST /api/v1/auth/login`: optional `x-tenant-id` for tenant-scoped login; omit it only when the
      normalized email exists in registry `staff_login_directory` (slugless directory login).
    - Authenticated routes use Bearer JWT from login (response includes `tenantId`, `tenantSlug`).
    - Composed products use **extras** (catalog `/api/v1/catalog/extras`) and composition types; order lines use `composition.steps[].extraIds`.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /platform/v1/tenants:
    post:
      summary: Provision tenant (platform key)
      security: [{ PlatformKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, databaseUrl]
              properties:
                slug: { type: string, pattern: '^[a-z0-9-]+$' }
                name: { type: string }
                databaseUrl: { type: string }
                ownerEmail: { type: string, format: email }
                ownerPassword: { type: string, minLength: 8 }
                ownerFullName: { type: string }
      responses:
        '201': { description: Created }
  /api/v1/auth/login:
    post:
      summary: Staff login
      description: |
        Omit `x-tenant-id` when email is in `staff_login_directory`; otherwise send slug/UUID to pick tenant DB.
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tenantId, tenantSlug, staff]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: string, example: '7d' }
                  tenantId: { type: string, format: uuid }
                  tenantSlug: { type: string }
                  staff:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      fullName: { type: string }
                      role: { type: string, enum: [OWNER, MANAGER, CASHIER] }
        '401': { description: Invalid credentials }
  /api/v1/auth/me:
    get:
      summary: Current staff
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: Staff profile }
  /api/v1/catalog/categories:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: Category list }
  /api/v1/catalog/products:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Product list }
  /api/v1/catalog/extras:
    get:
      summary: List extras
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: extras array }
    post:
      summary: Create extra (OWNER/MANAGER)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: Created }
  /api/v1/catalog/extras/{id}:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
    delete:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /api/v1/catalog/composition-types:
    get:
      summary: List composition types
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: includeInactive
          in: query
          schema: { type: string }
      responses:
        '200': { description: compositionTypes — extraIds, extras, mode EXTRAS or PRODUCTS }
    post:
      summary: Create composition type (OWNER/MANAGER)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: Created }
  /api/v1/catalog/composition-types/{id}:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
    delete:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /api/v1/catalog/composition-types/{id}/extras:
    put:
      summary: Replace linked extras (ordered)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extraIds]
              properties:
                extraIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /api/v1/orders:
    post:
      summary: Create order (optional Idempotency-Key)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [DRAFT, ACTIVE] }
                tableId: { type: string, format: uuid, nullable: true }
                sessionId: { type: string, format: uuid, nullable: true }
                lines:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: integer }
                      modifierIds: { type: array, items: { type: string } }
                      composition:
                        type: object
                        description: Required for COMPOSED products — steps parallel to product composition
                        properties:
                          steps:
                            type: array
                            items:
                              type: object
                              required: [compositionTypeId, extraIds]
                              properties:
                                compositionTypeId: { type: string, format: uuid }
                                extraIds:
                                  type: array
                                  items: { type: string, format: uuid }
                      note: { type: string }
      responses:
        '201':
          description: order + printJobs (customer_receipt, kitchen_ticket)
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, CANCELED] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: orders }
  /api/v1/orders/{id}:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: order }
  /api/v1/orders/{id}/status:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, ACTIVE, COMPLETED, CANCELED]
      responses:
        '200': { description: updated order }
  /api/v1/tables:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: tables }
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: table }
  /api/v1/sessions/open:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: session }
  /api/v1/sessions/active:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: open session or null }
  /api/v1/sessions/{id}/close:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: closed session + summary }
  /api/v1/stats/summary:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: aggregates }
  /api/v1/settings:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: settings map + defaultTaxBps }
  /api/v1/settings/tax:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: defaultTaxBps }
components:
  parameters:
    TenantHeaderOptional:
      name: x-tenant-id
      in: header
      required: false
      schema: { type: string }
      description: Tenant slug or registry UUID; optional when Bearer staff JWT is sent (tenant from token).
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    PlatformKey:
      type: apiKey
      in: header
      name: x-platform-key
