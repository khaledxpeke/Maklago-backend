openapi: 3.0.3
info:
  title: maklaGo API
  version: 1.0.0
  description: |
    Cashier-focused REST API for `/api/v1/*`:
    - Optional header `x-tenant-id` (tenant slug or registry UUID). With `Authorization: Bearer` staff JWT,
      the tenant is resolved from the token when this header is omitted.
    - `POST /api/v1/auth/login`: optional `x-tenant-id` for tenant-scoped login; omit it only when the
      normalized email exists in registry `staff_login_directory` (slugless directory login).
    - Authenticated routes use Bearer JWT from login (response includes `tenantId`, `tenantSlug`).
    - **`GET /api/v1/orders`**: backoffice — enriched lines (names, images). **`GET /api/v1/mobile/orders`**: slim payload matching realtime.
    - `POST /api/v1/orders`: body **`products`** `{ categoryId, id, count, price, extras?[] }`, plus required **`subtotal`**, **`tva`**, **`total`** (same integer unit as stored, must match server); new orders are **`waiting`** from the server.
    - **Mobile bootstrap:** `GET /api/v1/catalog/categories/menu` returns slim `{ categories[] }` with **`id`** on nested entities, `kind`, and `type[].extras`.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /platform/v1/tenants:
    post:
      summary: Provision tenant (platform key)
      security: [{ PlatformKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, databaseUrl]
              properties:
                slug: { type: string, pattern: '^[a-z0-9-]+$' }
                name: { type: string }
                databaseUrl: { type: string }
                ownerEmail: { type: string, format: email }
                ownerPassword: { type: string, minLength: 8 }
                ownerFullName: { type: string }
      responses:
        '201': { description: Created }
  /platform/v1/tenants/{id}/bootstrap-owner:
    post:
      summary: Bootstrap first owner (tenant created without owner)
      security: [{ PlatformKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerEmail, ownerPassword, ownerFullName]
              properties:
                ownerEmail: { type: string, format: email }
                ownerPassword: { type: string, minLength: 8 }
                ownerFullName: { type: string }
      responses:
        '201': { description: Created }
        '409': { description: Already has owner or email conflict }
  /api/v1/auth/login:
    post:
      summary: Staff login
      description: |
        Omit `x-tenant-id` when email is in `staff_login_directory`; otherwise send slug/UUID to pick tenant DB.
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tenantId, tenantSlug, staff]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: string, example: '7d' }
                  tenantId: { type: string, format: uuid }
                  tenantSlug: { type: string }
                  staff:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      fullName: { type: string }
                      role: { type: string, enum: [owner, manager, cashier] }
                      hasPin: { type: boolean }
                      requiresMobilePin: { type: boolean, description: Owner — PIN exists and mobile gate is on }
        '401': { description: Invalid credentials }
        '403': { description: Tenant disabled (tenant_blocked) }
  /api/v1/auth/me:
    get:
      summary: Current staff
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: Staff profile }
  /api/v1/auth/me/pin-mobile-enabled:
    patch:
      summary: Toggle mobile PIN gate (owner)
      description: |
        PIN digits are set/cleared only from the backoffice. Owners use this to enable or disable requiring PIN on mobile when a PIN exists.
        Enabling requires `pinHash` (PIN configured). Disabling while a PIN exists requires `currentPin`.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinMobileEnabled]
              properties:
                pinMobileEnabled: { type: boolean }
                currentPin:
                  type: string
                  pattern: '^\\d{4}$'
                  description: Required when turning gate off while a PIN is set.
      responses:
        '200': { description: Updated staff PIN flags }
        '400': { description: pin_required | current_pin_required | validation_error }
        '401': { description: invalid_pin }
        '403': { description: Forbidden (non-owner) }
  /api/v1/catalog/categories:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: Category list }
  /api/v1/catalog/products:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Product list }
  /api/v1/catalog/categories/menu:
    get:
      summary: Mobile menu (slim category → products → type → extras)
      description: |
        `categories[]`: `{ id, name, image, products }`.
        Each product: `{ id, category, name, image, description, price, originalPrice, kind, outOfStock, isActive, type }`.
        Nested `type[]` use `id`; each extra uses `id`.
        Composed products: `type[]` has `{ id, name, message, selection, max, min, mode, extras }`; each extra `{ id, name, image, price, originalPrice, outOfStock }`.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200':
          description: '{ categories } slim mobile shape; entities use id'
        '401': { description: Unauthorized }
  /api/v1/catalog/extras:
    get:
      summary: List extras
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: extras array }
    post:
      summary: Create extra (owner/manager)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: Created }
  /api/v1/catalog/extras/{id}:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
    delete:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /api/v1/catalog/composition-types:
    get:
      summary: List composition types
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: includeInactive
          in: query
          schema: { type: string }
      responses:
        '200': { description: compositionTypes — extraIds, extras, mode extras or products }
    post:
      summary: Create composition type (owner/manager)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: Created }
  /api/v1/catalog/composition-types/{id}:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
    delete:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /api/v1/catalog/composition-types/{id}/extras:
    put:
      summary: Replace linked extras (ordered)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 12, maxLength: 36 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extraIds]
              properties:
                extraIds:
                  type: array
                  items: { type: string, minLength: 12, maxLength: 36 }
      responses:
        '200': { description: OK }
  /api/v1/orders:
    post:
      summary: Create order (status waiting; products snapshot)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [products, subtotal, tva, total]
              properties:
                orderType: { type: string, enum: [dine_in, takeaway], default: takeaway }
                tableId:
                  type: string
                  nullable: true
                  description: 12 lowercase hex entity id, or legacy UUID
                note: { type: string, description: 'Optional note for the whole order' }
                customerName: { type: string }
                discount: { type: integer, minimum: 0, maximum: 100, default: 0, description: 'Order-level discount percent (0–100)' }
                paymentMethod: { type: string, enum: [cash, card, unpaid], default: unpaid }
                subtotal: { type: integer, minimum: 0, description: 'Sum of line net totals (must match server)' }
                tva: { type: integer, minimum: 0, description: 'Sum of line TVA amounts (must match server)' }
                total: { type: integer, minimum: 0, description: 'Final total after discount (must match server)' }
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [categoryId, id, count, price]
                    properties:
                      categoryId:
                        type: string
                        minLength: 12
                        maxLength: 36
                      id:
                        type: string
                        minLength: 12
                        maxLength: 36
                      count: { type: integer, minimum: 1 }
                      price: { type: integer, minimum: 0 }
                      extras:
                        type: array
                        items:
                          type: object
                          required: [id, count, price]
                          properties:
                            id: { type: string }
                            count: { type: integer, minimum: 0 }
                            price: { type: integer, minimum: 0 }
      responses:
        '201':
          description: order + printJobs (customer_receipt, kitchen_ticket)
    get:
      summary: List orders (backoffice enriched)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, confirmed, preparing, completed, canceled]
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: '{ orders[] } enriched lines (names, extras names, images)' }
  /api/v1/orders/{id}:
    get:
      summary: Get order by id (enriched)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 12, maxLength: 36 }
      responses:
        '200': { description: '{ order } enriched for dashboard' }
  /api/v1/orders/{id}/status:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [waiting, confirmed, preparing, completed, canceled]
      responses:
        '200': { description: updated order }
  /api/v1/tables:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: tables }
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: table }
  /api/v1/sessions/open:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '201': { description: session }
  /api/v1/sessions/active:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: open session or null }
  /api/v1/sessions/{id}/close:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: closed session + summary }
  /api/v1/stats/summary:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: aggregates }
  /api/v1/settings:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: settings map + defaultTaxBps }
  /api/v1/settings/tax:
    patch:
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeaderOptional'
      responses:
        '200': { description: defaultTaxBps }
components:
  parameters:
    TenantHeaderOptional:
      name: x-tenant-id
      in: header
      required: false
      schema: { type: string }
      description: Tenant slug or registry UUID; optional when Bearer staff JWT is sent (tenant from token).
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    PlatformKey:
      type: apiKey
      in: header
      name: x-platform-key
